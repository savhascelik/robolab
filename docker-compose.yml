services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: circuitlab-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      APP_NAME: "CircuitLab 3D API"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://127.0.0.1:8000"
      DB_CONNECTION: sqlite
      DB_DATABASE: "/var/www/html/storage/database/database.sqlite"
      AI_DEFAULT_PROVIDER: nebius
      FRONTEND_URL: "http://127.0.0.1:5173"
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - backend_sqlite:/var/www/html/storage/database
      - ./backend/.env:/var/www/html/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: circuitlab-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      PORT: "5173"
      HOST: "0.0.0.0"
      BACKEND_INTERNAL_URL: "http://backend:8000"
    depends_on:
      - backend

volumes:
  backend_sqlite:
